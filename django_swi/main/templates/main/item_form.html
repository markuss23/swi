{% extends 'main/base.html' %}

{% block title %}{% if item %}Edit Item{% else %}Add Item{% endif %} - SWI App{% endblock %}

{% block content %}
    <h2>{% if item %}Edit Item{% else %}Add New Item{% endif %}</h2>
    
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Save</button>
        <a href="{% url 'home' %}">Cancel</a>
    </form>
{% endblock %}
